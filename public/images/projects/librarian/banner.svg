  <text x="129" y="39" fill="#e0e6f0" font-size="15">Repositories</text><text x="308" y="39" fill="#7f8da3" font-size="14">Sync history</text><text x="449" y="39" fill="#7f8da3" font-size="14">Access</text>
  <text x="43" y="110" fill="#b6c4d8" font-size="15">Connected sources</text>
