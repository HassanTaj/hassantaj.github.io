   <circle cx="635" cy="49" r="4" fill="#54d4bd"/><text x="649" y="54" fill="#9eb7c9" font-size="13">Synced</text>
  </g>
  <text x="44" y="287" fill="#b6c4d8" font-size="15">Latest snapshot</text>
  <g stroke="#7d8da9" stroke-opacity=".3" stroke-width="9" stroke-linecap="round"><path d="M47 320h237M47 347h174M47 374h215"/></g>
  <rect x="440" y="275" width="368" height="225" rx="12" fill="#101722" stroke="#56657e" stroke-opacity=".3"/>
  <text x="463" y="309" fill="#aebbd0" font-size="14">Repository → Snapshot → Reader</text>
  <path d="M466 360h315M466 398h315M466 436h315" stroke="#2b384c"/>
