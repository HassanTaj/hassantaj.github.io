  <path d="M0 62h850" stroke="#425167" stroke-opacity=".4"/>
  <g fill="#67758c" fill-opacity=".6"><circle cx="27" cy="31" r="6"/><circle cx="48" cy="31" r="6"/><circle cx="69" cy="31" r="6"/></g>
