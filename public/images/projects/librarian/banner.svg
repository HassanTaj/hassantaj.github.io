<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" fill="none">
<title>Librarian documentation reader and repository synchronization</title>
<desc>Layered dark application windows with documentation and Git synchronization, lit by blue and violet accents.</desc>
<defs>
 <linearGradient id="bg" x2="1440" y2="810" gradientUnits="userSpaceOnUse"><stop stop-color="#050509"/><stop offset="1" stop-color="#080f18"/></linearGradient>
 <linearGradient id="win" x2="850" y2="620" gradientUnits="userSpaceOnUse"><stop stop-color="#1c2735"/><stop offset=".45" stop-color="#101722"/><stop offset="1" stop-color="#090e16"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#8393aa" stop-opacity=".7"/><stop offset=".5" stop-color="#42556f" stop-opacity=".3"/><stop offset="1" stop-color="#a16ded" stop-opacity=".6"/></linearGradient>
 <radialGradient id="violet"><stop stop-color="#e8d1ff"/><stop offset=".18" stop-color="#b27bf3" stop-opacity=".85"/><stop offset=".5" stop-color="#7436ce" stop-opacity=".3"/><stop offset="1" stop-color="#7436ce" stop-opacity="0"/></radialGradient>
 <radialGradient id="blue"><stop stop-color="#4a81b8" stop-opacity=".55"/><stop offset="1" stop-color="#3265aa" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".75"/></filter>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#8ca5c9" fill-opacity=".14"/></pattern>
 <g id="doc" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0h11l5 5v17H0zM11 0v6h5M4 11h8M4 15h8"/></g>
 <g id="git" stroke="currentColor" stroke-width="2"><circle r="3"/><circle cy="24" r="3"/><circle cx="18" r="3"/><path d="M0 3v18M18 3c0 10-18 7-18 14"/></g>
</defs>
<path fill="url(#bg)" d="M0 0h1440v810H0z"/>
<ellipse cx="1340" cy="45" rx="590" ry="420" fill="url(#blue)"/>
<ellipse cx="0" cy="760" rx="420" ry="360" fill="url(#violet)"/>
<ellipse cx="1410" cy="830" rx="440" ry="320" fill="url(#violet)"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
