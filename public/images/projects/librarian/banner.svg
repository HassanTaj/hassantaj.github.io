  <path d="M0 60h1050M64 60v440M292 60v440" stroke="#506079" stroke-opacity=".35"/>
  <g fill="#7d8ba3"><circle cx="28" cy="30" r="6"/><circle cx="50" cy="30" r="6"/><circle cx="72" cy="30" r="6"/></g>
  <rect x="114" y="15" width="231" height="31" rx="7" fill="#1e2a3a"/><text x="132" y="36" fill="#b6c4d7" font-size="13">Librarian / Documentation</text>
  <rect x="716" y="16" width="248" height="29" rx="7" fill="#1b2533" stroke="#526178" stroke-opacity=".3"/><circle cx="733" cy="30" r="5" stroke="#8291a8"/><path d="m737 34 4 4" stroke="#8291a8"/><text x="753" y="35" fill="#8491a6" font-size="12">Search documentation</text><circle cx="1008" cy="30" r="12" fill="#3e5072"/>
  <rect x="13" y="83" width="38" height="38" rx="9" fill="#34305b" stroke="#8a6cdd" stroke-opacity=".6"/><path d="m23 96 9-5 9 5v13H23zM29 109v-8h6v8" stroke="#b7a5f4" stroke-width="1.6"/>
  <use href="#doc" x="24" y="148" color="#7e8da5"/><use href="#git" transform="translate(24 205) scale(.85)" color="#7e8da5"/><path d="m24 281 8-5 8 5v10l-8 5-8-5z" stroke="#7e8da5" stroke-width="1.6"/>
  <text x="88" y="102" fill="#d2daea" font-size="13" font-weight="600">DOCUMENTATION</text>
  <rect x="77" y="126" width="201" height="36" rx="7" fill="#272540"/><rect x="77" y="133" width="3" height="22" rx="1.5" fill="#a68bf4"/><text x="97" y="149" fill="#d6cbfa" font-size="14">Overview</text>
  <g fill="#94a2b9" font-size="13"><text x="97" y="193">Getting started</text><text x="97" y="234">Repositories</text><text x="97" y="275">Reader access</text><text x="97" y="316">Instance settings</text><text x="97" y="357">Recovery</text></g>
  <path d="M90 391h172" stroke="#40506a" stroke-opacity=".4"/><circle cx="97" cy="425" r="4" fill="#60d2b1"/><text x="109" y="430" fill="#8fabc0" font-size="12">Snapshot ready</text>
  <path fill="url(#dots)" d="M310 80h710v398H310z"/>
  <text x="334" y="110" fill="#8193ae" font-size="12">Documentation / Overview</text>
  <text x="332" y="162" fill="#edf1fa" font-size="35" font-weight="600" letter-spacing="-.7">Your docs. Connected.</text>
  <g stroke="#677991" stroke-width="7" stroke-linecap="round" stroke-opacity=".5"><path d="M336 194h376M336 214h292"/></g>
  <rect x="333" y="247" width="470" height="101" rx="10" fill="#182237" stroke="#7777ca" stroke-opacity=".4"/><path d="M334 263v69" stroke="#a38ae9" stroke-width="3"/>
  <use href="#doc" x="354" y="267" color="#a89aeb"/><text x="386" y="283" fill="#c9d6eb" font-size="15" font-weight="500">Read from Git. Publish with confidence.</text>
  <g stroke="#697b98" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"><path d="M357 308h367M357 327h262"/></g>
  <text x="334" y="386" fill="#d0dbea" font-size="18" font-weight="500">Getting started</text>
  <g stroke="#697b98" stroke-opacity=".4" stroke-width="7" stroke-linecap="round"><path d="M337 412h449M337 433h380M337 454h419"/></g>
  <path d="M836 125v310" stroke="#526079" stroke-opacity=".3"/><text x="857" y="144" fill="#bac6d9" font-size="12">ON THIS PAGE</text>
  <g fill="#7f91ad" font-size="12"><text x="858" y="179">Overview</text><text x="858" y="210">Getting started</text><text x="858" y="241">Repository sync</text><text x="858" y="272">Access controls</text></g><path d="M839 168v18" stroke="#a28ce8" stroke-width="2"/>
 </g>
</g>
</svg>
